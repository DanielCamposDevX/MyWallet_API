services:
  mysql:
    image: mysql:8.4
    container_name: mywallet_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mywallet
      MYSQL_USER: mywallet
      MYSQL_PASSWORD: mywallet
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mywallet_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: mywallet
      DB_PASSWORD: mywallet
      DB_NAME: mywallet
      TYPEORM_SYNCHRONIZE: "false"
      TYPEORM_RUN_MIGRATIONS: "true"
    ports:
      - "5000:5000"

volumes:
  mysql_data:
